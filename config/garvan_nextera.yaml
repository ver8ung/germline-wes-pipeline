# =============================================================================
# Overlay config for the Garvan/Nextera NA12878 cross-validation run.
# Merged on top of config/config.yaml; only the keys below are overridden.
#
# Usage (note: --cores right after the configfile value so Snakemake 8's greedy
# --configfile does not swallow the target):
#   run --configfile config/garvan_nextera.yaml --cores 8 all benchmark
#
# Produces the same pipeline outputs PLUS results/benchmark/happy.garvan_nextera.*
# so its benchmark coexists with the primary Twist-Onso run's happy.summary.*.
# (Intermediate/annotated outputs are cohort-level and share paths with the
# primary run — run sequentially; copy results/annotated aside if you need both.)
# =============================================================================

# NA12878 sequenced on Illumina HiSeq with the Nextera Expanded Exome kit.
units: config/units.garvan_nextera.tsv

# Use the kit that MATCHES this data: the lifted Nextera Expanded Exome BED.
intervals:
  bed: resources/intervals/nextera_expandedexome.GRCh38.bed

# Namespace this run's hap.py output so it does not overwrite the primary run's.
benchmark:
  label: garvan_nextera
